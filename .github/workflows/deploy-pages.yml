name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [kts]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build PWA
        run: npm run build
        env:
          VITE_BASE: /capstone_music_ver2/
          # 백엔드가 별도 서버에 배포된 경우 아래 주석 해제 후 GitHub Secret 설정
          # VITE_API_BASE: ${{ secrets.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
