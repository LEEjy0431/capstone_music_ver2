name: capstone_music
# ============================================================
# Anaconda 환경 정의 — code/ Python 분석 파이프라인
#
# [공통] 생성:
#   conda env create -f code/environment.yml
#   conda activate capstone_music
#
# [macOS Apple Silicon] 생성:
#   CONDA_SUBDIR=osx-arm64 conda env create -f code/environment.yml
#   conda activate capstone_music
#
# 업데이트 (environment.yml 변경 후):
#   conda env update -f code/environment.yml --prune
# ============================================================

channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  - python=3.10

  # ── 수치 연산 ──────────────────────────────────────────────
  - numpy=1.26.4
  - scipy=1.11.4
  - numba=0.65.0
  - scikit-learn=1.8.0

  # ── 오디오 처리 ────────────────────────────────────────────
  - librosa=0.11.0
  - soundfile=0.13.1
  - resampy=0.4.3
  - soxr=1.0.0
  - audioread=3.1.0

  # ── MIDI / 악보 처리 ───────────────────────────────────────
  - pretty_midi=0.2.11
  - mido=1.3.3

  # ── PyTorch (CPU 기본; GPU 필요 시 pytorch-cuda 채널 추가) ─
  - pytorch::pytorch=2.1.0
  - pytorch::torchvision

  # ── 유틸리티 ──────────────────────────────────────────────
  - matplotlib=3.10.8
  - pillow=12.2.0
  - requests=2.33.1
  - joblib=1.5.3
  - packaging=26.0
  - pip

  - pip:
    # ── 악보 파싱 ───────────────────────────────────────────
    - music21==9.9.1

    # ── 피아노 전사 모델 ────────────────────────────────────
    - piano-transcription-inference==0.0.6
    - torchlibrosa==0.1.0
    - onnxruntime==1.24.4

    # ── TensorFlow ─────────────────────────────────────────
    # macOS Apple Silicon: 아래 주석 해제, tensorflow 라인 주석 처리
    # - tensorflow-macos==2.16.2
    # - tensorflow-metal       # GPU 가속 (선택)
    #
    # Windows / Linux:
    - tensorflow==2.16.2

    # ── LLM / GPT 피드백 (module4) ──────────────────────────
    - openai>=1.30.0
    - python-dotenv>=1.0.0
