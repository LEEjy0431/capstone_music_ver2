name: piano_eval
description: 피아노 연주 자동 평가 시스템 — Flutter Web + Android
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & 파일
  http: ^1.2.0
  file_picker: ^8.0.0

  # 상태 관리
  provider: ^6.1.0

  # 로컬 저장소
  shared_preferences: ^2.2.0

  # 차트
  fl_chart: ^0.68.0

  # 국제화 유틸
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
